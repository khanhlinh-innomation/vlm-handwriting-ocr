### model
model_name_or_path: zai-org/GLM-OCR
adapter_name_or_path: /workspace/vlm-handwriting/checkpoints/glm_ocr/meddies_continued_lora_3e-5_epoch7/checkpoint-18340
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
create_new_adapter: false
lora_rank: 8
lora_target: all

### 220 divorce pages + Meddies/UIT replay prepared previously
dataset_dir: /workspace/vlm-handwriting/data/llamafactory/glm_ocr_divorce
dataset: divorce_domain_train
eval_dataset: divorce_validation
template: glm_ocr
cutoff_len: 4096
preprocessing_num_workers: 8
dataloader_num_workers: 2

### keep every epoch for validation ranking
output_dir: /workspace/vlm-handwriting/checkpoints/glm_ocr/divorce_from_meddies7_lora_1e-5_10epoch
logging_steps: 5
save_strategy: epoch
save_total_limit: 10
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
num_train_epochs: 10.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
fp16: false
seed: 42
ddp_timeout: 180000000
resume_from_checkpoint: null
skip_memory_metrics: false

### validation loss per epoch; generated CER ranking runs separately
do_eval: true
per_device_eval_batch_size: 1
eval_strategy: epoch
predict_with_generate: false
