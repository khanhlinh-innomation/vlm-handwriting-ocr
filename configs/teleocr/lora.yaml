model:
  id: StarDoc-AI/TeleOCR
  system_prompt: "You are a helpful assistant."
  prompt: "Please output the text content from the image."

data:
  seed: 42

lora:
  rank: 8
  alpha: 32
  dropout: 0.05
  target_suffixes:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: /workspace/vlm-handwriting/checkpoints/teleocr/lora_full
  num_train_epochs: 3.0
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0001
  scheduler: cosine
  warmup_ratio: 0.1
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  strategy: epoch
  save_total_limit: 3
  seed: 42
  overwrite_output_dir: false
