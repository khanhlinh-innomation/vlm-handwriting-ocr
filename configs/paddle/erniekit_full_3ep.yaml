### frozen train/validation paths; validation runs separately after training
train_dataset_type: "erniekit"
eval_dataset_type: "erniekit"
train_dataset_path: "/workspace/vlm-handwriting/data/erniekit/paddleocr_vl/train.jsonl"
train_dataset_prob: "1.0"
eval_dataset_path: "/workspace/vlm-handwriting/data/erniekit/paddleocr_vl/validation.jsonl"
eval_dataset_prob: "1.0"
max_seq_len: 8192
num_samples_each_epoch: 6346
use_pic_id: false
sft_replace_ids: true
sft_image_normalize: true
sft_image_rescale: true
image_dtype: "float32"

### local official model snapshot and full-SFT path
model_name_or_path: /workspace/vlm-handwriting/models/PaddleOCR-VL-1.6
fine_tuning: Full
multimodal: true
use_flash_attention: true
use_sparse_flash_attn: true

### three epochs; 100 optimizer steps per epoch
stage: OCR-VL-SFT
seed: 42
do_train: true
do_eval: false
distributed_dataloader: false
dataloader_num_workers: 4
prefetch_factor: 4
batch_size: 1
packing_size: 2
packing: true
padding: false
num_train_epochs: 3
max_steps: 300
eval_batch_size: 1
evaluation_strategy: "no"
save_steps: 100
save_total_limit: 3
save_strategy: steps
logging_steps: 1
report_to: none
release_grads: true
gradient_accumulation_steps: 32
logging_dir: /workspace/vlm-handwriting/checkpoints/paddleocr_vl/full_sft_3ep_run1/tensorboard_logs
output_dir: /workspace/vlm-handwriting/checkpoints/paddleocr_vl/full_sft_3ep_run1
disable_tqdm: false

### optimizer
warmup_steps: 3
learning_rate: 5.0e-6
lr_scheduler_type: cosine
min_lr: 5.0e-7
layerwise_lr_decay_bound: 1.0
from_scratch: 0
weight_decay: 0.1
adam_epsilon: 1.0e-8
adam_beta1: 0.9
adam_beta2: 0.95

### single-GPU memory controls verified by smoke
tensor_parallel_degree: 1
pipeline_parallel_degree: 1
sharding_parallel_degree: 1
sharding: stage1
sequence_parallel: false
pipeline_parallel_config: enable_delay_scale_loss enable_release_grads disable_partial_send_recv
recompute: true
recompute_granularity: "full"
recompute_use_reentrant: true
compute_type: bf16
fp16_opt_level: O2
disable_ckpt_quant: true
amp_custom_white_list:
  - lookup_table
  - lookup_table_v2
  - flash_attn
  - matmul
  - matmul_v2
  - fused_gemm_epilogue
amp_custom_black_list:
  - reduce_sum
  - softmax_with_cross_entropy
  - c_softmax_with_cross_entropy
  - elementwise_div
  - sin
  - cos
unified_checkpoint: true
convert_from_hf: true
save_to_hf: true
